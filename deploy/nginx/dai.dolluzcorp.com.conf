# dAI (Kody) - nginx site for dai.dolluzcorp.com
#
# Matches the pattern the other dApps use: one pm2 process on its own localhost
# port, proxied from here. Port 4011, because 4000 to 4010 are taken.
#
# There is no static root. The other dApps serve a React build from
# /var/www/dolluzcorp.com/<app>/build; dAI has no React app and is not going to
# have one, because Kody is a browser extension. The one page it serves is the
# extension sign in page, and Express serves that with its own content security
# policy, which the test suite asserts. Serving it from nginx instead would move
# that policy into a file nothing tests, and what ships would stop being what is
# tested.
#
# Install:
#   sudo cp dai.dolluzcorp.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/dai.dolluzcorp.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dai.dolluzcorp.com

# A question can name a patient, and a search term travels in the query string.
# $uri is the path without the query; $request would include it. An access log
# is kept, rotated and backed up like any other file, so the query never enters
# it in the first place.
log_format dai_noquery '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                       '$request_time';

server {
    listen 80;
    listen [::]:80;
    server_name dai.dolluzcorp.com;

    # certbot adds its own challenge location above this when it runs.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dai.dolluzcorp.com;

    # certbot --nginx writes these two lines. Left commented so nginx -t passes
    # before the certificate exists; certbot replaces them on first run.
    # ssl_certificate     /etc/letsencrypt/live/dai.dolluzcorp.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dai.dolluzcorp.com/privkey.pem;

    access_log /var/log/nginx/dai.access.log dai_noquery;
    error_log  /var/log/nginx/dai.error.log;

    # nginx serves the certificate, so nginx is where HSTS belongs. Do not add
    # preload until every Dolluz subdomain is https: preload is hard to undo.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # The app caps a file at MAX_FILE_MB=25. File sharing is off for the pilot,
    # but if it is ever turned on, nginx refuses an oversized body before Node
    # buffers it.
    client_max_body_size 26m;

    # No trailing slash on proxy_pass. The app mounts its routes at /api/...,
    # and a trailing slash would make nginx strip the /api/ prefix and 404
    # everything. Same as dAdmin's site file.
    location /api/ {
        proxy_pass http://localhost:4011;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The extension sign in page, its stylesheet, script and icon.
    location /extension/ {
        proxy_pass http://localhost:4011;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO. Without Upgrade and Connection the handshake fails and realtime
    # silently does not work: the client reconnects for ever and nothing says
    # why. The long timeouts are because a websocket is idle between messages
    # and the default 60s would cut it.
    location /socket.io/ {
        proxy_pass http://localhost:4011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Liveness. Says the process is up and checks nothing else, which is what an
    # uptime monitor should watch: a check that tests the database restarts the
    # app during a database blip and turns a small outage into a large one.
    location = /health {
        proxy_pass http://localhost:4011;
        proxy_set_header Host $host;
        access_log off;
    }

    # Readiness names the migrations that have not been applied, which is more
    # than the public needs. It stays on the box.
    location = /health/ready {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://localhost:4011;
        proxy_set_header Host $host;
    }

    # Nothing else is served here. dAI is an API and one sign in page.
    location / { return 404; }
}
