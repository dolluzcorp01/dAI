# dAI - stage one, before a certificate exists.
#
# This file exists because the full site file cannot be installed first. It has
# `listen 443 ssl`, and nginx refuses to load an ssl listener with no
# certificate, so `nginx -t` fails and the file cannot be enabled. certbot
# --nginx then cannot run either, because it reloads nginx and nginx will not
# load. Chicken and egg, found on the real box on 2026-10-05.
#
# So: install this, get the certificate with certonly, then swap in the full
# file. See docs/16-pilot-runbook.md step 1d.
#
#   sudo cp dai.dolluzcorp.com.http-only.conf /etc/nginx/sites-available/dai.dolluzcorp.com.conf
#   sudo ln -s /etc/nginx/sites-available/dai.dolluzcorp.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/html -d dai.dolluzcorp.com

server {
    listen 80;
    listen [::]:80;
    server_name dai.dolluzcorp.com;

    # What the certificate request is fetched from.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Nothing else is served yet. Not a redirect to https: there is no
    # certificate at this stage, so a redirect would send people to a port that
    # cannot answer.
    location / {
        return 404;
    }
}
