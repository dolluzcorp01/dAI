# Local development stack. Production runs on DigitalOcean managed services.
services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-kody}
      MYSQL_USER: ${DB_USER:-kody}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]

  # Vector store for the knowledge layer. Separate from MySQL by design.
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${PG_USER:-kody}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-change_me}
      POSTGRES_DB: ${PG_DB:-kody_vectors}
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]

volumes:
  mysql_data:
  redis_data:
  pg_data:
